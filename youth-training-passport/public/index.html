<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>訓練護照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Hallmark · genre: editorial · macrostructure: Map / Diagram · theme: Almanac
 * nav: N6 Newspaper masthead (left-flush variant · issue-line above · wordmark 2xl · double rule)
 * footer: Ft4 Dense colophon · enrichment: none (typography only) · designed-as-app
 * tone: 護照／年鑑 · anchor hue: 165 (green) · accent hue: 286 (indigo)
 * pre-emit critique: P5 H4 E4 S5 R4 V4
 * contrast: pass (40–41) · icons: pass (30) · tokens: pass (48)
 * chrome: pass (47) · honest: pass (46) · mobile: pass (34, 49, 50–57)
 *
 * Type: display Big Shoulders · body Noto Sans TC · outlier JetBrains Mono
 *   outlier 只服務一個角色：可轉錄的識別碼（護照 ID、ID 輸入欄、週次代碼）。
 *
 * Design position: 「卡片＝可以改的東西，版面＝已經發生的紀錄」
 * .card  → 編輯面（表單、教練工具、彈窗）有框、有影、可觸碰
 * .folio → 紀錄面（塔、進度、課表、成長）只有髮絲線，像護照內頁
 */

:root{
  color-scheme: light;

  /* ---- paper & ink (anchor hue 165) ---- */
  --paper:        oklch(97.2% 0.008 165);
  --paper-weave:  oklch(95.4% 0.011 165);
  --surface:      oklch(99.2% 0.004 165);   /* 不是純白 */
  --surface-2:    oklch(95.6% 0.009 165);
  --surface-3:    oklch(93.2% 0.011 165);
  --ink:          oklch(21% 0.020 168);
  --ink-2:        oklch(44% 0.016 168);
  --ink-3:        oklch(47% 0.014 168);     /* muted — 已驗過 4.5:1 */
  --rule:         oklch(21% 0.020 168 / .14);
  --rule-soft:    oklch(21% 0.020 168 / .08);

  /* ---- accent (indigo 286) ---- */
  --accent:        oklch(41% 0.165 286);
  --accent-strong: oklch(34% 0.150 286);
  --accent-ink:    oklch(99.2% 0.004 165);
  --accent-soft:   oklch(94% 0.030 286);
  --focus:         oklch(48% 0.180 286);

  /* ---- 七元素：solid 給圖塊與點，deep 給文字，soft 給底 ---- */
  --c-fms:           oklch(56% 0.150 258);
  --c-fms-deep:      oklch(40% 0.130 258);
  --c-fms-on:        oklch(99% 0.004 165);
  --c-strength:      oklch(56% 0.170 30);
  --c-strength-deep: oklch(40% 0.145 30);
  --c-strength-on:   oklch(99% 0.004 165);
  --c-power:         oklch(70% 0.150 75);
  --c-power-deep:    oklch(45% 0.110 65);
  --c-power-on:      oklch(20% 0.040 75);   /* 琥珀色配深墨，不配白 */
  --c-plyo:          oklch(47% 0.180 295);
  --c-plyo-deep:     oklch(38% 0.160 295);
  --c-plyo-on:       oklch(99% 0.004 165);
  --c-saq:           oklch(58% 0.120 163);
  --c-saq-deep:      oklch(42% 0.100 163);
  --c-saq-on:        oklch(99% 0.004 165);
  --c-energy:        oklch(52% 0.110 55);
  --c-energy-deep:   oklch(40% 0.095 55);
  --c-energy-on:     oklch(99% 0.004 165);
  --c-mobility:      oklch(58% 0.170 350);
  --c-mobility-deep: oklch(43% 0.150 350);
  --c-mobility-on:   oklch(99% 0.004 165);

  --gold:   oklch(78% 0.145 88);
  --silver: oklch(72% 0.020 250);

  --good:      oklch(48% 0.130 150);
  --good-soft: oklch(94% 0.035 150);
  --warn:      oklch(50% 0.110 70);
  --warn-soft: oklch(94% 0.040 80);
  --bad:       oklch(50% 0.180 27);
  --bad-soft:  oklch(94% 0.035 27);

  /* ---- type ---- */
  --font-display: 'Big Shoulders Display', 'Noto Sans TC', system-ui, sans-serif;
  --font-body:    'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', sans-serif;
  /* outlier 只有兩個位置：護照 ID 本身、以及輸入 ID 的欄位。2+1 規則的 outlier ≤ 2 slots。 */
  --font-outlier: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', 'Noto Sans TC', monospace;

  --text-2xs:  0.6875rem;  /* 11 */
  --text-xs:   0.75rem;    /* 12 */
  --text-sm:   0.8125rem;  /* 13 */
  --text-md:   0.9375rem;  /* 15 — base */
  --text-lg:   1.0625rem;  /* 17 */
  --text-xl:   1.375rem;   /* 22 */
  --text-2xl:  1.75rem;    /* 28 */
  --text-3xl:  2.25rem;    /* 36 */
  --text-mast: clamp(2.5rem, 11vw, 3.5rem);

  --lh-display: 1.02;
  --lh-tight:   1.2;
  --lh-body:    1.6;

  /* ---- 4pt space scale ---- */
  --space-3xs: 0.125rem;  --space-2xs: 0.25rem;  --space-xs:  0.5rem;
  --space-sm:  0.75rem;   --space-md:  1rem;     --space-lg:  1.5rem;
  --space-xl:  2.5rem;    --space-2xl: 4rem;     --space-3xl: 6rem;

  --gutter:   var(--space-md);
  --page-max: 44rem;

  /* ---- rules, radius, elevation ---- */
  --rule-hair: 1px;
  --radius-sm: 6px;  --radius-md: 10px;  --radius-lg: 14px;  --radius-pill: 999px;
  --shadow-card: 0 1px 2px oklch(21% 0.02 168 / .05), 0 10px 26px -18px oklch(21% 0.02 168 / .28);

  /* ---- motion ---- */
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms;  --dur-short: 220ms;  --dur-long: 420ms;

  /* ---- z scale ---- */
  --z-base: 1;  --z-raised: 10;  --z-dropdown: 100;
  --z-sticky: 200;  --z-sticky-nav: 300;  --z-modal: 400;  --z-toast: 500;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme: dark;
    --paper:        oklch(16% 0.014 165);
    --paper-weave:  oklch(19% 0.016 165);
    --surface:      oklch(21% 0.016 165);
    --surface-2:    oklch(25% 0.016 165);
    --surface-3:    oklch(29% 0.016 165);
    --ink:          oklch(94% 0.008 165);
    --ink-2:        oklch(78% 0.012 165);
    --ink-3:        oklch(72% 0.012 165);
    --rule:         oklch(94% 0.008 165 / .16);
    --rule-soft:    oklch(94% 0.008 165 / .09);
    --accent:        oklch(74% 0.135 286);
    --accent-strong: oklch(82% 0.115 286);
    --accent-ink:    oklch(18% 0.040 286);
    --accent-soft:   oklch(30% 0.060 286);
    --focus:         oklch(78% 0.140 286);
    --c-fms:           oklch(66% 0.135 258);  --c-fms-deep:      oklch(80% 0.100 258);  --c-fms-on:      oklch(16% 0.030 258);
    --c-strength:      oklch(64% 0.155 30);   --c-strength-deep: oklch(80% 0.110 30);   --c-strength-on: oklch(16% 0.030 30);
    --c-power:         oklch(74% 0.135 75);   --c-power-deep:    oklch(84% 0.110 75);   --c-power-on:    oklch(18% 0.035 75);
    --c-plyo:          oklch(62% 0.155 295);  --c-plyo-deep:     oklch(80% 0.115 295);  --c-plyo-on:     oklch(16% 0.030 295);
    --c-saq:           oklch(66% 0.115 163);  --c-saq-deep:      oklch(82% 0.090 163);  --c-saq-on:      oklch(16% 0.030 163);
    --c-energy:        oklch(62% 0.100 55);   --c-energy-deep:   oklch(80% 0.085 55);   --c-energy-on:   oklch(16% 0.030 55);
    --c-mobility:      oklch(66% 0.150 350);  --c-mobility-deep: oklch(82% 0.105 350);  --c-mobility-on: oklch(16% 0.030 350);
    --gold:   oklch(80% 0.135 88);
    --silver: oklch(76% 0.020 250);
    --good:      oklch(76% 0.135 150);  --good-soft: oklch(28% 0.055 150);
    --warn:      oklch(80% 0.110 80);   --warn-soft: oklch(29% 0.050 80);
    --bad:       oklch(72% 0.150 27);   --bad-soft:  oklch(28% 0.060 27);
    --shadow-card: 0 1px 2px oklch(0% 0 0 / .34), 0 12px 30px -20px oklch(0% 0 0 / .62);
  }
}
:root[data-theme="dark"]{ color-scheme: dark;
  --paper:        oklch(16% 0.014 165);
  --paper-weave:  oklch(19% 0.016 165);
  --surface:      oklch(21% 0.016 165);

  --c-strength:      oklch(64% 0.155 30);   --c-strength-deep: oklch(80% 0.110 30);   --c-strength-on: oklch(16% 0.030 30);
  --c-power:         oklch(74% 0.135 75);   --c-power-deep:    oklch(84% 0.110 75);   --c-power-on:    oklch(18% 0.035 75);

  --good:      oklch(76% 0.135 150);  --good-soft: oklch(28% 0.055 150);
  --warn:      oklch(80% 0.110 80);   --warn-soft: oklch(29% 0.050 80);

}

/* ===================== base ===================== */
*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; overflow-x: clip; font-family: var(--font-body); }
body{
  margin: 0; overflow-x: clip;
  background: var(--paper);
  background-image: radial-gradient(circle at 1px 1px, var(--paper-weave) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-md);
  line-height: var(--lh-body);
}
h1,h2,h3,h4{ margin: 0; font-weight: 700; font-style: normal; text-wrap: balance;
             overflow-wrap: anywhere; min-width: 0; line-height: var(--lh-tight); }
p{ margin: 0; }
a{ color: var(--accent); text-underline-offset: 2px; }
button{ font: inherit; color: inherit; }
[hidden]{ display: none !important; }

:focus{ outline: none; }
:focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; border-radius: inherit; }

.muted{ color: var(--ink-3); }
.sec{ color: var(--ink-2); }
.small{ font-size: var(--text-sm); }
.tabular,.num{ font-variant-numeric: tabular-nums; }
.num{ font-family: var(--font-display); }
.mono{ font-family: var(--font-outlier); }
.rule{ border: 0; border-top: var(--rule-hair) solid var(--rule); margin: 0; }

/* 色票髮絲環：讓淺色（琥珀）色塊也有 3:1 的可辨邊界，不必動品牌色 */
.legend i, .prow .lbl i, .ex-list li i, .erow .dot, .chip i, .ecell i,
.grid td.name i, .pk-item .dot, .lib-item .dot, .tb i, .minibricks i, .prow .bar i{
  box-shadow: inset 0 0 0 1px oklch(21% 0.02 168 / .28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .legend i, :root:not([data-theme="light"]) .prow .lbl i,
  :root:not([data-theme="light"]) .ex-list li i, :root:not([data-theme="light"]) .erow .dot,
  :root:not([data-theme="light"]) .chip i, :root:not([data-theme="light"]) .ecell i,
  :root:not([data-theme="light"]) .grid td.name i, :root:not([data-theme="light"]) .pk-item .dot,
  :root:not([data-theme="light"]) .lib-item .dot, :root:not([data-theme="light"]) .tb i,
  :root:not([data-theme="light"]) .minibricks i, :root:not([data-theme="light"]) .prow .bar i{
    box-shadow: inset 0 0 0 1px oklch(94% 0.008 165 / .24);
  }
}
:root[data-theme="dark"] .legend i, :root[data-theme="dark"] .prow .lbl i,
:root[data-theme="dark"] .ex-list li i, :root[data-theme="dark"] .erow .dot,
:root[data-theme="dark"] .chip i, :root[data-theme="dark"] .ecell i,
:root[data-theme="dark"] .grid td.name i, :root[data-theme="dark"] .pk-item .dot,
:root[data-theme="dark"] .lib-item .dot, :root[data-theme="dark"] .tb i,
:root[data-theme="dark"] .minibricks i, :root[data-theme="dark"] .prow .bar i{
  box-shadow: inset 0 0 0 1px oklch(94% 0.008 165 / .24);
}

/* ===================== page ===================== */
.page{
  max-width: var(--page-max); margin-inline: auto;
  padding: var(--space-lg) var(--gutter) var(--space-3xl);
  display: flex; flex-direction: column; gap: var(--space-lg);
}
.page.wide{ --page-max: 74rem; }

.eyebrow{
  font-size: var(--text-2xs); font-weight: 700; letter-spacing: .08em;
  line-height: 1.4; text-transform: uppercase; color: var(--ink-3);
}

/* ---- N6 masthead (left-flush variant) ---- */
.topbar{
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-sm); min-height: 44px;
}
.brand{
  font-family: var(--font-display); font-weight: 900; font-size: var(--text-xl);
  letter-spacing: .01em; line-height: 1.1; text-decoration: none; color: var(--ink);
}
.brand:hover{ text-decoration: underline; text-decoration-thickness: 2px; }

.header{
  display: grid; grid-template-columns: minmax(0,1fr) auto;
  align-items: end; gap: var(--space-sm);
  padding-block-end: var(--space-sm);
  border-block-end: 3px double var(--rule);   /* 年鑑的雙線 */
}
.header-text{ min-width: 0; }
.header-name{
  font-family: var(--font-display); font-weight: 900;
  font-size: var(--text-mast); line-height: var(--lh-display);
  letter-spacing: .005em; overflow-wrap: anywhere; min-width: 0;
  margin-block: var(--space-3xs) var(--space-2xs);
}
.header-sub{
  display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm);
  font-size: var(--text-sm); color: var(--ink-2);
}
.header-sub span{ white-space: nowrap; }
.avatar{
  flex: none; width: 60px; height: 60px; border-radius: 50%;
  background: var(--accent-soft); border: var(--rule-hair) solid var(--accent);
  color: var(--accent-strong); display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 900; font-size: var(--text-2xl); line-height: 1;
}
.avatar.sm{ width: 40px; height: 40px; font-size: var(--text-lg); }

/* ---- Ft4 dense colophon ---- */
.colophon{
  margin-block-start: var(--space-xl);
  padding-block-start: var(--space-sm);
  border-block-start: var(--rule-hair) solid var(--rule);
  font-size: var(--text-2xs); line-height: 1.75; color: var(--ink-3);
  overflow-wrap: anywhere;
}
.colophon b{ font-family: var(--font-outlier); font-weight: 700; letter-spacing: .02em; color: var(--ink-2); }

/* ===================== buttons — 8 states ===================== */
.btn{
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2xs);
  min-height: 40px; padding: var(--space-xs) var(--space-md);
  border-radius: var(--radius-md); border: var(--rule-hair) solid var(--rule);
  background: var(--surface); color: var(--ink);
  cursor: pointer; font-weight: 500; line-height: 1.2; white-space: nowrap;
  outline: 2px solid transparent; outline-offset: 2px;
  transition: background-color var(--dur-micro) var(--ease-out),
              border-color var(--dur-micro) var(--ease-out),
              transform var(--dur-micro) var(--ease-out);
}
@media (hover: hover) and (pointer: fine){
  .btn:hover{ background: var(--surface-2); }
}
.btn:active{ transform: translateY(1px); background: var(--surface-3); }
.btn[disabled],.btn[aria-disabled="true"]{
  opacity: .55; cursor: not-allowed; transform: none; background: var(--surface);
}
.btn[data-state="loading"]{ cursor: progress; }
.btn[data-state="loading"]::before{
  content: ''; width: .7em; height: .7em; border-radius: 50%;
  border: 2px solid currentColor; border-block-start-color: transparent;
  animation: spin 700ms linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

.btn.primary{ background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
@media (hover: hover) and (pointer: fine){ .btn.primary:hover{ background: var(--accent-strong); border-color: var(--accent-strong); } }
.btn.primary:active{ background: var(--accent-strong); }
.btn.danger{ color: var(--bad); border-color: var(--bad); }
@media (hover: hover) and (pointer: fine){ .btn.danger:hover{ background: var(--bad-soft); } }
.btn.ghost{ border-color: transparent; background: transparent; }
@media (hover: hover) and (pointer: fine){ .btn.ghost:hover{ background: var(--surface-2); } }

.btn.sm{ min-height: 36px; padding: var(--space-2xs) var(--space-sm); font-size: var(--text-sm); border-radius: var(--radius-sm); }
.btn.xs{ min-height: 28px; padding: var(--space-3xs) var(--space-xs); font-size: var(--text-xs); border-radius: var(--radius-sm); position: relative; }
/* 小按鈕：視覺小，命中區補到 44px */
.btn.xs::before{ content: ''; position: absolute; inset: -8px -6px; }
@media (pointer: coarse){
  .btn{ min-height: 44px; }
  .btn.sm{ min-height: 40px; }
  .btn.xs::before{ inset: -10px -8px; }
}

/* ===================== inputs — no layout shift ===================== */
input,select,textarea{
  font: inherit; color: var(--ink); background: var(--surface);
  border: var(--rule-hair) solid var(--rule); border-radius: var(--radius-sm);
  padding: var(--space-xs) var(--space-sm); min-width: 0; min-height: 40px;
  outline: 2px solid transparent; outline-offset: 1px;
  transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
}
@media (hover: hover) and (pointer: fine){
  input:hover,select:hover,textarea:hover{ background: var(--surface-2); }
}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline: 2px solid var(--focus); border-color: var(--ink-2);
}
input[disabled],select[disabled],textarea[disabled]{ opacity: .55; cursor: not-allowed; }
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{
  border-color: var(--bad); background: var(--bad-soft);
}
input::placeholder,textarea::placeholder{ color: var(--ink-3); }
@media (pointer: coarse){ input,select,textarea{ min-height: 44px; } }

/* 訊息槽：預留一行，出現時不推版面 */
.msg{ font-size: var(--text-sm); padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-md); min-height: 1lh; }
.msg.ok{ background: var(--good-soft); color: var(--good); }
.msg.err{ background: var(--bad-soft); color: var(--bad); }
.msg.err::before{ content: '⚠ '; }
.note{ background: var(--accent-soft); color: var(--accent-strong);
       padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); font-size: var(--text-sm); }

/* ===================== 版面：folio（紀錄面）vs card（編輯面）===================== */
.folio{ display: flex; flex-direction: column; gap: var(--space-sm); }
.folio + .folio{ padding-block-start: var(--space-lg); border-block-start: var(--rule-hair) solid var(--rule); }
.folio-head{ display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-sm); flex-wrap: wrap; }
.folio-title{ font-family: var(--font-display); font-weight: 900; font-size: var(--text-xl); line-height: 1.1; }
.folio-title small{ font-family: var(--font-body); font-weight: 400; font-size: var(--text-sm); color: var(--ink-3); margin-inline-start: var(--space-xs); }

.card{
  background: var(--surface); border: var(--rule-hair) solid var(--rule-soft);
  border-radius: var(--radius-lg); padding: var(--space-md);
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; gap: var(--space-sm);
}
.card-head{ display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); flex-wrap: wrap; }
.card-head select{ max-width: 100%; flex: 1 1 200px; }
.card-title{ font-size: var(--text-lg); font-weight: 700; line-height: var(--lh-tight); }
.card-title small{ font-weight: 400; font-size: var(--text-sm); color: var(--ink-3); margin-inline-start: var(--space-2xs); }

/* 分頁內容：這裡以前沒有 gap，卡片會黏在一起 */
#tabbody{ display: flex; flex-direction: column; gap: var(--space-lg); }

/* ===================== tabs ===================== */
.tabs{
  position: sticky; top: 0; z-index: var(--z-sticky);
  display: flex; gap: var(--space-2xs); overflow-x: auto;
  margin-inline: calc(var(--gutter) * -1); padding: var(--space-xs) var(--gutter);
  background: linear-gradient(var(--paper) 82%, transparent);
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar{ display: none; }
.tab{
  flex: none; min-height: 40px; padding: var(--space-2xs) var(--space-sm);
  border-radius: var(--radius-pill); border: var(--rule-hair) solid transparent;
  background: transparent; cursor: pointer; white-space: nowrap;
  font-weight: 500; font-size: var(--text-md); color: var(--ink-2);
  outline: 2px solid transparent; outline-offset: 2px;
  transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
}
@media (hover: hover) and (pointer: fine){ .tab:hover{ background: var(--surface-2); color: var(--ink); } }
.tab:active{ transform: translateY(1px); }
.tab[aria-selected="true"]{ background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.tab.coach{ border-color: var(--rule); }
@media (pointer: coarse){ .tab{ min-height: 44px; } }

/* ===================== 塔 = Map / Diagram（全幅，不裝在卡裡）===================== */
.tower-wrap{ position: relative; margin-inline: calc(var(--gutter) * -1); }
#tower{ width: 100%; height: auto; display: block; touch-action: manipulation; }
.popover{
  position: absolute; left: 50%; bottom: var(--space-sm); transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-md);
  font-size: var(--text-sm); line-height: 1.45; max-width: 92%;
  box-shadow: var(--shadow-card); pointer-events: none; z-index: var(--z-raised);
}
.popover b{ display: block; font-size: var(--text-md); }
.legend{ display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm); font-size: var(--text-xs); color: var(--ink-2); }
.legend span{ display: inline-flex; align-items: center; gap: var(--space-3xs); white-space: nowrap; }
.legend i{ display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* ---- 數字條：年鑑式，用髮絲線分隔，不用磚塊 ---- */
.tiles{ display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0;
        border-block: var(--rule-hair) solid var(--rule); }
.tile{ padding: var(--space-sm) var(--space-xs); display: flex; flex-direction: column; gap: var(--space-3xs); }
.tile + .tile{ border-inline-start: var(--rule-hair) solid var(--rule-soft); padding-inline-start: var(--space-sm); }
.tile .v{ font-family: var(--font-display); font-weight: 900; font-size: var(--text-3xl); line-height: 1; font-variant-numeric: tabular-nums; }
.tile .k{ font-size: var(--text-xs); color: var(--ink-2); }

/* ===================== 進度列 / 分布圖 ===================== */
.prow{ display: grid; grid-template-columns: 5.5rem minmax(0,1fr) 4rem; align-items: center; gap: var(--space-sm); font-size: var(--text-sm); }
.prow .bar{ height: 10px; border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden; }
.prow .bar i{ display: block; height: 100%; border-radius: var(--radius-sm); }
.prow .lbl{ display: flex; align-items: center; gap: var(--space-2xs); min-width: 0; }
.prow .lbl i{ width: 9px; height: 9px; border-radius: 3px; flex: none; }
.prow .val{ text-align: end; color: var(--ink-2); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }

.dist{ display: flex; flex-direction: column; gap: var(--space-sm); }
.drow{ display: grid; grid-template-columns: 5.5rem minmax(0,1fr) 4.5rem; align-items: center; gap: var(--space-sm); font-size: var(--text-sm); }
.drow .track{ position: relative; height: 26px; }
.drow .band{ position: absolute; top: 0; height: 100%; background: var(--surface-2); border-radius: var(--radius-sm); }
.drow .tgt{ position: absolute; top: -2px; width: 2px; height: calc(100% + 4px); background: var(--ink-3); border-radius: 1px; }
.drow .act{ position: absolute; top: 7px; height: 12px; border-radius: 0 4px 4px 0; }
.drow .base{ position: absolute; top: 21px; width: 0; height: 0;
             border-inline: 5px solid transparent; border-block-end: 6px solid var(--ink-2); transform: translateX(-5px); }
.drow .mark{ text-align: end; font-size: var(--text-xs); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mark.ok{ color: var(--good); } .mark.low{ color: var(--bad); } .mark.high{ color: var(--warn); }

.seg{ display: inline-flex; border: var(--rule-hair) solid var(--rule); border-radius: var(--radius-pill); overflow: hidden; }
.seg button{ border: 0; background: transparent; min-height: 36px; padding: var(--space-2xs) var(--space-sm);
             font-size: var(--text-sm); cursor: pointer; color: var(--ink-2); white-space: nowrap; }
@media (hover: hover) and (pointer: fine){ .seg button:hover{ background: var(--surface-2); } }
.seg button:active{ background: var(--surface-3); }
.seg button[aria-pressed="true"]{ background: var(--accent); color: var(--accent-ink); font-weight: 700; }
@media (pointer: coarse){ .seg button{ min-height: 44px; } }

/* ===================== chips：淡底 + 深字 + 色點（不再白字壓色底）===================== */
.chip{
  display: inline-flex; align-items: center; gap: var(--space-3xs);
  padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-pill);
  background: var(--surface-2); font-size: var(--text-xs); color: var(--ink-2); white-space: nowrap;
}
.chip i{ width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip.axis{
  background: color-mix(in oklab, var(--c, var(--accent)) 15%, var(--surface));
  color: var(--c-deep, var(--accent-strong));
  font-weight: 700;
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c, var(--accent)) 30%, transparent);
}
.chips{ display: flex; flex-wrap: wrap; gap: var(--space-2xs); }

/* ===================== 課堂紀錄 ===================== */
.sess{ padding-block-start: var(--space-md); border-block-start: var(--rule-hair) solid var(--rule-soft);
       display: flex; flex-direction: column; gap: var(--space-xs); }
.sess:first-child{ border-block-start: 0; padding-block-start: 0; }
.sess-head{ display: flex; align-items: baseline; gap: var(--space-sm); flex-wrap: wrap; }
.sess-date{ font-family: var(--font-display); font-weight: 900; font-size: var(--text-xl); line-height: 1; font-variant-numeric: tabular-nums; }
.sess-meta{ flex: 1; font-size: var(--text-sm); color: var(--ink-2); min-width: 0; }
.ex-list{ margin: 0; padding: 0; list-style: none;
          display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--space-3xs) var(--space-sm); font-size: var(--text-sm); }
.ex-list li{ display: flex; gap: var(--space-2xs); align-items: baseline; min-width: 0; }
.ex-list li i{ width: 7px; height: 7px; border-radius: 2px; flex: none; }
.ex-list li b{ font-weight: 500; }
.ex-list li span{ color: var(--ink-3); font-size: var(--text-xs); }
.ex-list li.adhoc b::after{ content: ' ＋'; color: var(--accent); }
@media (max-width: 30rem){ .ex-list{ grid-template-columns: minmax(0,1fr); } }

/* ===================== 課堂板塊 A–E ===================== */
.statbar{ display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.statbar .s{ display: inline-flex; align-items: baseline; gap: var(--space-2xs);
             padding: var(--space-2xs) var(--space-sm); border: var(--rule-hair) solid var(--rule);
             border-radius: var(--radius-md); font-size: var(--text-xs); color: var(--ink-2); white-space: nowrap; }
.statbar .s b{ font-family: var(--font-display); font-weight: 900; font-size: var(--text-xl);
               line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }

.sgrps{ display: flex; flex-direction: column; gap: var(--space-md); }
.sgrp{ display: flex; flex-direction: column; gap: var(--space-2xs); }
.sgrp-head{ display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; }
.badge{
  flex: none; width: 26px; height: 26px; border-radius: var(--radius-sm);
  background: var(--seg, var(--accent)); color: var(--seg-ink, var(--accent-ink));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 900; font-size: var(--text-lg); line-height: 1;
}
.sgrp-head .t{ font-weight: 700; font-size: var(--text-md); }
.sgrp-head .zh{ font-size: var(--text-xs); color: var(--ink-3); }
.sgrp-head .sp{ flex: 1; }
.sgrp-head .mins{ width: 3.25rem; text-align: center; padding-inline: var(--space-2xs); font-size: var(--text-xs); }
/* 側邊粗色條 → 髮絲線 + 色點標題（editorial：hairlines, not stripes） */
.sgrp-body{
  border-inline-start: var(--rule-hair) solid var(--rule);
  padding: var(--space-2xs) 0 var(--space-2xs) var(--space-md);
  margin-inline-start: 12px;
  display: flex; flex-direction: column;
}
.sgrp-body.empty{ padding-block: var(--space-xs); color: var(--ink-3); font-size: var(--text-xs); }

.erow{ display: flex; align-items: baseline; gap: var(--space-xs); padding-block: var(--space-xs);
       border-block-start: var(--rule-hair) solid var(--rule-soft); min-width: 0; }
.erow:first-child{ border-block-start: 0; }
.erow .dot{ flex: none; width: 7px; height: 7px; border-radius: 2px; align-self: center; }
.erow .nm{ flex: 1; font-weight: 500; font-size: var(--text-md); min-width: 0; }
.erow .nm em{ font-style: normal; font-size: var(--text-xs); color: var(--ink-3); }
.erow .ds{ font-size: var(--text-sm); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.erow.adhoc .nm::after{ content: ' ＋'; color: var(--accent); }

.erow-edit{ display: grid; grid-template-columns: minmax(0,1fr) auto 28px; gap: var(--space-2xs);
            align-items: center; padding-block: var(--space-2xs); border-block-start: var(--rule-hair) solid var(--rule-soft); }
.erow-edit:first-child{ border-block-start: 0; }
.erow-edit input{ padding: var(--space-2xs) var(--space-xs); font-size: var(--text-sm); width: 100%; min-height: 36px; }
.erow-edit .dz{ display: grid; grid-template-columns: 5.5rem 2.75rem 6.25rem 3.5rem; gap: var(--space-3xs); }
.erow-edit .dz input{ text-align: center; }
.erow-edit .dz select{ padding: var(--space-2xs) var(--space-3xs); font-size: var(--text-xs); min-height: 36px; }
.erow-edit .x_reps{ text-align: start !important; }
.erow-edit .x_del{ width: 28px; padding: 0; min-height: 28px; }
/* 有示範影片的動作，排課時左邊多一格縮圖。
   桌機沒有具名區域，交給自動排版（縮圖是第一個子元素，會落在第一欄）；
   手機才需要 grid-area，因為那邊有 grid-template-areas。 */
.erow-edit:has(> .thumb){ grid-template-columns: auto minmax(0,1fr) auto 28px; }
@media (max-width: 35rem){
  .erow-edit{ grid-template-columns: minmax(0,1fr) 28px; grid-template-areas: "nm del" "dz dz"; }
  .erow-edit:has(> .thumb){ grid-template-columns: auto minmax(0,1fr) 28px; grid-template-areas: "th nm del" "dz dz dz"; }
  .erow-edit > .thumb{ grid-area: th; }
  .erow-edit .x_name{ grid-area: nm; }
  .erow-edit .x_del{ grid-area: del; }
  .erow-edit .dz{ grid-area: dz; grid-template-columns: 5.25rem 2.625rem minmax(0,1fr) 3.25rem; }
}

/* ===================== 表格 ===================== */
.tbl{ width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.tbl th,.tbl td{ padding: var(--space-2xs) var(--space-xs); border-block-end: var(--rule-hair) solid var(--rule-soft);
                 text-align: start; vertical-align: middle; }
.tbl th{ font-size: var(--text-xs); color: var(--ink-2); font-weight: 700; letter-spacing: .04em; }
.tbl td.r,.tbl th.r{ text-align: end; }
.scroll-x{ overflow-x: auto; -webkit-overflow-scrolling: touch;
           margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); }

.grid{ min-width: 600px; border-collapse: collapse; font-size: var(--text-sm); width: 100%; }
.grid th,.grid td{ border: var(--rule-hair) solid var(--rule-soft); padding: var(--space-3xs) var(--space-2xs); }
.grid th{ background: var(--surface-2); font-weight: 700; font-size: var(--text-xs); color: var(--ink-2); }
.grid th.now,.grid td.now{ background: var(--accent-soft); }
.grid td.seg{ background: var(--surface-2); font-weight: 700; font-size: var(--text-xs);
              letter-spacing: .06em; border-radius: 0; display: table-cell; border: var(--rule-hair) solid var(--rule-soft); }
.grid td.name{ min-width: 10rem; }
.grid td.name i{ display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-inline-end: var(--space-2xs); }
.grid td.dose{ text-align: center; white-space: nowrap; }
.grid input{ width: 100%; padding: var(--space-3xs) var(--space-2xs); border-radius: 5px; font-size: var(--text-xs); min-height: 32px; }
.grid input.dose{ width: 3.875rem; text-align: center; }
.grid select{ padding: var(--space-3xs) var(--space-3xs); font-size: var(--text-xs); border-radius: 5px; min-height: 32px; }
.grid td.seg .badge{ width: 19px; height: 19px; font-size: var(--text-md); border-radius: 5px;
                     display: inline-flex; vertical-align: -4px; margin-inline-end: var(--space-3xs); }

/* ===================== forms ===================== */
.form{ display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--space-sm); }
.form .full{ grid-column: 1 / -1; }
.field{ display: flex; flex-direction: column; gap: var(--space-3xs); font-size: var(--text-sm); color: var(--ink-2); }
.field > input,.field > select,.field > textarea{ width: 100%; }
.field textarea{ min-height: 4.5rem; resize: vertical; }
.row{ display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
.checks{ display: flex; flex-wrap: wrap; gap: var(--space-2xs); }
.checks label{
  display: inline-flex; align-items: center; gap: var(--space-2xs);
  min-height: 36px; padding: var(--space-2xs) var(--space-sm);
  border-radius: var(--radius-pill); border: var(--rule-hair) solid var(--rule);
  font-size: var(--text-sm); cursor: pointer; background: var(--surface); white-space: nowrap;
}
@media (hover: hover) and (pointer: fine){ .checks label:hover{ background: var(--surface-2); } }
.checks label:has(input:checked){ background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 700; }
.checks label:has(input:focus-visible){ outline: 2px solid var(--focus); outline-offset: 2px; }
.checks input{ margin: 0; min-height: 0; }
@media (pointer: coarse){ .checks label{ min-height: 44px; } }

.ex-edit{ display: grid; grid-template-columns: minmax(0,1fr) 4.75rem 4rem 30px; gap: var(--space-2xs); align-items: center; }
.ex-edit input{ padding: var(--space-2xs) var(--space-xs); font-size: var(--text-sm); min-height: 36px; }
.ex-edit .seglbl{ grid-column: 1 / -1; font-size: var(--text-2xs);
                  letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-block-start: var(--space-2xs); }

/* ===================== RAMP focus 9-grid ===================== */
.focus9{ display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--space-xs); }
.fcell{ border: var(--rule-hair) solid var(--rule-soft); border-radius: var(--radius-md);
        padding: var(--space-xs); display: flex; flex-direction: column; gap: var(--space-3xs); font-size: var(--text-xs); }
.fcell b{ font-size: var(--text-sm); }
.dots{ display: flex; gap: var(--space-3xs); }
.dots i{ width: 14px; height: 8px; border-radius: 4px; background: var(--surface-3); }
.dots i.on{ background: var(--accent); }
.fcell.edit button{ text-align: start; border: 0; background: transparent; min-height: 32px;
                    padding: var(--space-3xs) 0; font-size: var(--text-xs); color: var(--ink-2); cursor: pointer; border-radius: var(--radius-sm); }
@media (hover: hover) and (pointer: fine){ .fcell.edit button:hover{ color: var(--ink); } }
.fcell.edit button.on{ color: var(--accent-strong); font-weight: 700; }
@media (max-width: 30rem){ .focus9{ grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* ===================== 突破方塊 ===================== */
.tb{ display: flex; gap: var(--space-sm); align-items: flex-start;
     padding-block: var(--space-sm); border-block-start: var(--rule-hair) solid var(--rule-soft); }
.tb:first-child{ border-block-start: 0; padding-block-start: 0; }
.tb i{ flex: none; width: 22px; height: 22px; border-radius: var(--radius-sm); margin-block-start: 3px; }
.tb.gold i{ background: var(--gold); }
.tb.silver i{ background: var(--silver); }
.tb.rainbow i{ background: linear-gradient(135deg, var(--c-strength), var(--c-power) 40%, var(--c-saq) 70%, var(--c-plyo)); }
.tb .s{ font-weight: 500; }

/* ===================== 成長 ===================== */
.spark{ width: 100%; height: 90px; display: block; }

/* ===================== 教練後台 ===================== */
.alist{ display: grid; grid-template-columns: minmax(0,1fr); gap: var(--space-2xs); }
.arow{
  display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: var(--space-sm); align-items: center;
  padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-md);
  border: var(--rule-hair) solid var(--rule-soft);
  text-decoration: none; color: inherit; min-height: 56px;
  outline: 2px solid transparent; outline-offset: 2px;
  transition: background-color var(--dur-micro) var(--ease-out);
}
@media (hover: hover) and (pointer: fine){ .arow:hover{ background: var(--surface-2); } }
.arow:focus-visible{ outline: 2px solid var(--focus); }
.arow:active{ background: var(--surface-3); }
.arow .av{ width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong);
           display: flex; align-items: center; justify-content: center;
           font-family: var(--font-display); font-weight: 900; font-size: var(--text-lg); }
.arow .nm{ font-weight: 700; }
.arow .sub{ font-size: var(--text-xs); color: var(--ink-2); }
.arow .stat{ text-align: end; font-size: var(--text-xs); color: var(--ink-2); }
.arow .stat b{ font-family: var(--font-display); font-size: var(--text-xl); color: var(--ink); font-variant-numeric: tabular-nums; }
.minibricks{ display: flex; gap: 2px; margin-block-start: var(--space-3xs); }
.minibricks i{ height: 6px; flex: 1; border-radius: 2px; background: var(--surface-3); }

details.section{ background: var(--surface); border: var(--rule-hair) solid var(--rule-soft);
                 border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
details.section > summary{ padding: var(--space-sm) var(--space-md); cursor: pointer; font-weight: 700;
                           list-style: none; display: flex; justify-content: space-between; align-items: center;
                           min-height: 48px; border-radius: var(--radius-lg); }
details.section > summary::-webkit-details-marker{ display: none; }
details.section > summary::after{ content: '＋'; color: var(--ink-3); }
details.section[open] > summary::after{ content: '－'; }
@media (hover: hover) and (pointer: fine){ details.section > summary:hover{ background: var(--surface-2); } }
details.section > .body{ padding: 0 var(--space-md) var(--space-md); display: flex; flex-direction: column; gap: var(--space-sm); }

/* ===================== 首頁 hero ===================== */
.hero{ padding-block: var(--space-lg) var(--space-xl); display: flex; flex-direction: column; gap: var(--space-xs); }
.hero h1{ font-family: var(--font-display); font-weight: 900;
          font-size: clamp(2.25rem, 10vw, 3rem); line-height: var(--lh-display);
          overflow-wrap: anywhere; min-width: 0; }
.hero p{ color: var(--ink-2); max-width: 34em; }
.search{ display: flex; gap: var(--space-xs); align-items: flex-end; }
.search .field{ flex: 1; min-width: 0; }
.search input{ width: 100%; font-family: var(--font-outlier); font-size: var(--text-lg);
               padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md);
               letter-spacing: .04em; min-height: 52px; }
.search .btn{ border-radius: var(--radius-md); padding-inline: var(--space-lg); min-height: 52px; }

/* 只給輔助技術讀的文字 */
.sr{ position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
     overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ===================== modal ===================== */
.modal{ position: fixed; inset: 0; background: oklch(21% 0.02 168 / .48);
        display: flex; align-items: center; justify-content: center;
        padding: var(--space-lg); z-index: var(--z-modal); }
.modal .card{ width: 100%; max-width: 24rem; }
.modal .card.sheet{ max-width: 35rem; max-height: min(84dvh, 45rem); }
@media (prefers-reduced-motion: no-preference){
  .modal{ animation: fade var(--dur-short) var(--ease-out); }
  .modal .card{ animation: rise var(--dur-short) var(--ease-out); }
  @keyframes fade{ from{ opacity: 0; } }
  @keyframes rise{ from{ opacity: 0; transform: scale(.97); } }
}

/* ---- 動作庫挑選器 ---- */
.sheet .card-title{ display: flex; align-items: center; gap: var(--space-xs); }
.sheet .card-title .badge{ width: 22px; height: 22px; font-size: var(--text-md); border-radius: 5px; }
.pk-list{ flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
          margin-inline: calc(var(--space-3xs) * -1); padding-inline: var(--space-3xs); min-height: 10rem; }
.pk-fam{ position: sticky; top: 0; background: var(--surface); padding: var(--space-xs) var(--space-3xs) var(--space-2xs);
         font-size: var(--text-2xs); font-weight: 700; letter-spacing: .08em;
         color: var(--ink-3); border-block-end: var(--rule-hair) solid var(--rule-soft); z-index: var(--z-raised); }
.pk-item{
  display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: var(--space-xs); align-items: center;
  width: 100%; text-align: start; min-height: 48px; padding: var(--space-xs);
  border: 0; border-block-end: var(--rule-hair) solid var(--rule-soft); background: transparent;
  cursor: pointer; color: inherit; font: inherit; border-radius: var(--radius-sm);
  outline: 2px solid transparent; outline-offset: -2px;
}
@media (hover: hover) and (pointer: fine){ .pk-item:hover{ background: var(--surface-2); } }
.pk-item:active{ background: var(--surface-3); }
.pk-item.on{ background: var(--accent-soft); }
.pk-item .dot{ width: 8px; height: 8px; border-radius: 2px; }
.pk-item .nm{ font-size: var(--text-md); font-weight: 500; display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2xs); }
.pk-item .nm em{ font-style: normal; font-size: var(--text-2xs); font-weight: 700;
                 color: var(--accent-strong); background: var(--accent-soft); border-radius: 4px; padding-inline: var(--space-3xs); }
.pk-item .nm .pkhint{ font-size: var(--text-xs); color: var(--ink-3); font-weight: 400; flex-basis: 100%; line-height: 1.45; }
.pk-item .d{ font-size: var(--text-xs); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pk-item.on .d::before{ content: '✓ '; color: var(--accent); font-weight: 700; }

/* ===================== 頭像 ===================== */
.avatar.art, .av.art{ color: var(--av); background: color-mix(in oklab, var(--av) 16%, var(--surface));
                      border-color: var(--av); overflow: hidden; }
.avatar.art svg, .av.art svg{ width: 78%; height: 78%; }
.avatar.pic, .av.pic{ padding: 0; overflow: hidden; border-color: var(--rule); background: var(--surface-2); }
.avatar.pic img, .av.pic img{ width: 100%; height: 100%; object-fit: cover; display: block; }
.avpick{ display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
.avopt{ padding: 3px; border: 2px solid transparent; border-radius: 50%; background: none; cursor: pointer; line-height: 0;
        outline: 2px solid transparent; outline-offset: 2px; }
.avopt.on{ border-color: var(--accent); }
.avopt.up{ width: 46px; height: 46px; border: var(--rule-hair) dashed var(--rule); border-radius: 50%;

.avopt.up img{ width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

/* ===================== 中期目標 ===================== */
.goalbar{ display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap;
          padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-md);
          background: var(--accent-soft); }
.goalbar.none{ background: var(--surface-2); color: var(--ink-2); }
.goalbar .gb-ic{ flex: none; width: 4px; align-self: stretch; min-height: 1.5rem; border-radius: 2px; background: var(--accent); }
.goalbar.none .gb-ic{ background: var(--ink-3); }
.goalbar .gb-t{ font-weight: 700; color: var(--accent-strong); min-width: 0; }
.goalbar.none .gb-t{ color: var(--ink-2); font-weight: 500; }
.goalbar .gb-t em{ font-style: normal; font-family: var(--font-outlier); font-size: var(--text-2xs); font-weight: 700; letter-spacing: .02em;
                   background: var(--accent); color: var(--accent-ink); border-radius: var(--radius-pill);
                   padding: 1px var(--space-xs); margin-inline-start: var(--space-2xs); }
.goalbar .gb-m{ margin-inline-start: auto; font-size: var(--text-xs); color: var(--ink-2); white-space: nowrap; }

.emph{ display: grid; grid-template-columns: repeat(auto-fit, minmax(8.25rem, 1fr)); gap: var(--space-2xs); }
.ecell{ display: flex; align-items: center; gap: var(--space-2xs); border: var(--rule-hair) solid var(--rule-soft);
        border-radius: var(--radius-sm); padding: var(--space-2xs) var(--space-xs); font-size: var(--text-sm); }
.ecell i{ width: 9px; height: 9px; border-radius: 3px; flex: none; }
.ecell span{ flex: 1; white-space: nowrap; min-width: 0; }
.ecell input{ width: 3.25rem; padding: var(--space-3xs) var(--space-2xs); text-align: center; font-size: var(--text-sm); min-height: 32px; }
small.warn{ color: var(--warn); }

/* ===================== 動作示範影片 =====================
 * 只存 YouTube 影片 ID：縮圖走 i.ytimg.com，播放走官方 iframe。
 * 不下載影片、不自行截圖——那違反 YT 條款。 */
.thumb{ position: relative; flex: none; width: 4rem; aspect-ratio: 16 / 9; border: 0; padding: 0; cursor: pointer;
        border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-2); display: block; }
.thumb img{ width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .play{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              font-size: var(--text-sm); color: oklch(99% 0 0); text-shadow: 0 1px 4px oklch(0% 0 0 / .7);
              background: oklch(0% 0 0 / .18); transition: background var(--dur-micro) var(--ease-out); }
.thumb:hover .play{ background: oklch(0% 0 0 / .34); }
.thumb.sm{ width: 3.25rem; }
.thumb.xs{ width: 2.75rem; border-radius: 4px; }
.thumb.empty{ background: var(--surface-2); border: var(--rule-hair) dashed var(--rule); cursor: default; }
.thumb.dead img{ display: none; }
.thumb.dead{ background: var(--surface-3); }
.thumb.dead .play{ background: none; color: var(--ink-3); text-shadow: none; }
.thumb:focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }

.modal.video .card{ max-width: 46rem; }
.vwrap{ position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius-md); overflow: hidden; background: oklch(0% 0 0); }
.vwrap iframe{ position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

.pk-row{ display: flex; align-items: center; gap: var(--space-2xs); }
.pk-row .pk-item{ flex: 1; min-width: 0; }

.vbar{ background: var(--surface-2); border-radius: var(--radius-md); padding: var(--space-xs) var(--space-sm); }
.vchk{ display: inline-flex; align-items: center; gap: var(--space-2xs); font-size: var(--text-sm);
       padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-pill);
       border: var(--rule-hair) solid var(--rule); background: var(--surface); cursor: pointer; min-height: 36px; }
.vchk:has(input:checked){ background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 500; }
.vbar .warn{ color: var(--warn); }
.lib-item.sug{ background: var(--warn-soft); border-radius: var(--radius-sm); }
.lib-item .nm em.vb{ color: var(--ink-2); background: var(--surface-3); }
.lib-item .nm em.vb.sug{ color: var(--warn); background: var(--warn-soft); }
.vsug{ grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
       gap: var(--space-xs); padding: var(--space-2xs) 0 var(--space-3xs); }
.vsug .vs-info{ display: flex; flex-direction: column; min-width: 0; flex: 1 1 14rem; }
.vsug .vs-info b{ font-size: var(--text-sm); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===================== 動作庫管理 ===================== */
.lib-groups{ display: flex; flex-direction: column; gap: var(--space-2xs); max-height: 62dvh; overflow-y: auto; }
.libfam{ border: var(--rule-hair) solid var(--rule-soft); border-radius: var(--radius-md); background: var(--surface); }
.libfam > summary{ padding: var(--space-xs) var(--space-sm); cursor: pointer; font-weight: 700; font-size: var(--text-sm);
                   list-style: none; display: flex; justify-content: space-between; align-items: center;
                   gap: var(--space-xs); min-height: 44px; border-radius: var(--radius-md); }
.libfam > summary::-webkit-details-marker{ display: none; }
.libfam[open] > summary{ border-block-end: var(--rule-hair) solid var(--rule-soft); }
.libitems{ padding: var(--space-3xs) var(--space-sm) var(--space-xs); }
.lib-item{ display: grid; grid-template-columns: auto auto minmax(0,1fr) auto auto auto; gap: var(--space-xs);
           align-items: center; padding-block: var(--space-xs); border-block-start: var(--rule-hair) solid var(--rule-soft); }
.lib-item:first-child{ border-block-start: 0; }
.lib-item .lk{ display: flex; }
.lib-item .dot{ width: 8px; height: 8px; border-radius: 2px; }
.lib-item .nm{ font-size: var(--text-sm); display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-3xs); min-width: 0; }
.lib-item .nm em{ font-style: normal; font-size: var(--text-2xs); font-weight: 700;
                  color: var(--accent-strong); background: var(--accent-soft); border-radius: 4px; padding-inline: var(--space-3xs); }
.lib-item .nm em.cu{ color: var(--ink-2); background: var(--surface-2); }
.lib-item .d{ font-size: var(--text-xs); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lib-item .sg{ width: 20px; height: 20px; border-radius: 5px; background: var(--seg, var(--accent)); color: var(--seg-ink, var(--accent-ink));
               font-family: var(--font-display); font-weight: 900; font-size: var(--text-sm);
               display: flex; align-items: center; justify-content: center; flex: none; }
.lib-item .acts{ display: flex; gap: var(--space-3xs); align-items: center; }
@media (max-width: 35rem){
  /* 手機兩行：上排是勾選／縮圖／名稱／板塊，下排是劑量與操作鈕 */
  .lib-item{ grid-template-columns: auto auto minmax(0,1fr) auto;
             grid-template-areas: "ck th nm sg" "d d acts acts"; row-gap: var(--space-3xs); }
  .lib-item .lk{ grid-area: ck; }
  .lib-item .dot, .lib-item > .thumb{ grid-area: th; }
  .lib-item .nm{ grid-area: nm; }
  .lib-item .sg{ grid-area: sg; }
  .lib-item .d{ grid-area: d; text-align: start; align-self: center; }
  .lib-item .acts{ grid-area: acts; justify-content: flex-end; }
  .lib-item .vsug{ grid-area: auto; grid-column: 1 / -1; }
}
.lib-row.edit{ padding-block: var(--space-xs); border-block-start: var(--rule-hair) solid var(--rule-soft); }
/* 家族名稱同名跨板塊時，標題右邊補一個板塊字母 */
.libfam .fseg{ display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px;
               border-radius: 5px; background: var(--seg, var(--accent)); color: var(--seg-ink, var(--accent-ink));
               font-family: var(--font-display); font-weight: 900; font-size: var(--text-xs); vertical-align: -3px; }
.lib-list{ display: flex; flex-direction: column; gap: var(--space-2xs); }
.lib-row{ display: grid; grid-template-columns: minmax(0,1.6fr) 6rem 8rem 2.875rem minmax(0,1fr) auto;
          gap: var(--space-2xs); align-items: center; }
.lib-row input, .lib-row select{ padding: var(--space-2xs) var(--space-xs); font-size: var(--text-sm); width: 100%; min-height: 36px; }
.lib-row .l_sets{ text-align: center; }
/* 編輯列比新增列多一欄「群組名稱」 */
.lib-row.edit{ grid-template-columns: minmax(0,1.4fr) 5.5rem 7.5rem 2.875rem minmax(0,1fr) minmax(0,1fr) auto; }
@media (max-width: 40rem){
  .lib-row{ grid-template-columns: minmax(0,1fr) 2.875rem minmax(0,1fr) auto;
            grid-template-areas: "nm nm nm act" "cat cat seg seg" "sets reps reps reps"; }
  .lib-row > :nth-child(1){ grid-area: nm; }
  .lib-row > :nth-child(2){ grid-area: cat; }
  .lib-row > :nth-child(3){ grid-area: seg; }
  .lib-row > :nth-child(4){ grid-area: sets; }
  .lib-row > :nth-child(5){ grid-area: reps; }
  .lib-row > :nth-child(6){ grid-area: act; }
  .lib-row.edit{ grid-template-areas: "nm nm nm act" "cat cat seg seg" "sets reps reps reps" "fam fam fam fam"; }
  .lib-row.edit > :nth-child(6){ grid-area: fam; }
  .lib-row.edit > :nth-child(7){ grid-area: act; }
}

/* ===================== toast — 只給失敗與可復原 ===================== */
.toasts{
  position: fixed; left: 50%; bottom: var(--space-md); transform: translateX(-50%);
  z-index: var(--z-toast); display: flex; flex-direction: column-reverse; gap: var(--space-2xs);
  width: min(28rem, calc(100% - var(--space-xl))); pointer-events: none;
}
.toast{
  display: flex; align-items: center; gap: var(--space-sm);
  background: var(--ink); color: var(--paper);
  padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-md);
  font-size: var(--text-sm); box-shadow: var(--shadow-card); pointer-events: auto;
}
.toast .tmsg{ flex: 1; min-width: 0; }
.toast .tact{
  flex: none; min-height: 32px; padding: var(--space-3xs) var(--space-sm);
  border: var(--rule-hair) solid currentColor; border-radius: var(--radius-sm);
  background: transparent; color: inherit; font-weight: 700; font-size: var(--text-sm);
  cursor: pointer; white-space: nowrap;
}
.toast .tact:active{ transform: translateY(1px); }
.toast.err{ background: var(--bad); color: oklch(99% 0.004 165); }
@media (prefers-reduced-motion: no-preference){
  .toast{ animation: pop var(--dur-short) var(--ease-out); }
  @keyframes pop{ from{ opacity: 0; transform: translateY(8px); } }
}

/* ===================== 桌面 ===================== */
@media (min-width: 60rem){
  :root{ --gutter: var(--space-xl); }
  .page{ --page-max: 48rem; }
  .page.wide{ --page-max: 74rem; }
  .page.wide .alist{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  .page.wide .grid{ min-width: 0; }
  .page.wide .scroll-x{ margin-inline: 0; padding-inline: 0; }
  .tiles{ grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media (min-width: 90rem){
  .page.wide{ --page-max: 84rem; }
  .page.wide .alist{ grid-template-columns: repeat(3, minmax(0,1fr)); }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: 150ms !important; animation-iteration-count: 1 !important;
    transition-duration: 150ms !important;
  }
  .btn:active,.tab:active,.seg button:active,.toast .tact:active{ transform: none; }
}
</style>
